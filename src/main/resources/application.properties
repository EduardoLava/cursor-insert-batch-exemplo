%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost/quarkus_test?reWriteBatchedInserts=true
%prod.quarkus.datasource.username=quarkus_test
%prod.quarkus.datasource.password=quarkus_test
%prod.quarkus.hibernate-orm.schema-management.strategy=create

%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.jdbc.statement-batch-size=100
quarkus.hibernate-orm.unsupported-properties."hibernate.order_inserts"=true
quarkus.hibernate-orm.unsupported-properties."hibernate.order_updates"=true

#quarkus.log.min-level=TRACE
#quarkus.log.category."org.hibernate.engine.jdbc.batch.internal.BatchImpl".level=TRACE
#quarkus.log.category."org.hibernate.engine.jdbc.batch.internal.BatchImpl".min-level=TRACE
%dev.quarkus.log.category."org.hibernate.orm.jdbc.batch".level=TRACE
%dev.quarkus.log.category."org.hibernate.orm.jdbc.batch".min-level=TRACE

# Tempo limite da transação em segundos (exemplo: 60 segundos)
quarkus.transaction-manager.default-transaction-timeout=1160s

#quarkus.log.category."org.hibernate.orm.jdbc.exec".level=DEBUG
#quarkus.log.category."org.hibernate.orm.jdbc.exec".min-level=DEBUG

#quarkus.log.min-level=TRACE

# 1. Categoria essencial para ver o BIND dos dados no lote
quarkus.log.category."org.hibernate.orm.jdbc.bind".level=TRACE
quarkus.log.category."org.hibernate.orm.jdbc.bind".min-level=TRACE

# 2. Categoria de batching do Hibernate 6+
#quarkus.log.category."org.hibernate.orm.jdbc.batch".level=TRACE
#quarkus.log.category."org.hibernate.orm.jdbc.batch".min-level=TRACE

# 3. Execução de comandos JDBC
#quarkus.log.category."org.hibernate.orm.jdbc.exec".level=DEBUG
#quarkus.log.category."org.hibernate.orm.jdbc.exec".min-level=DEBUG

# 4. (Opcional) Mostra o SQL preparado do batch
#quarkus.hibernate-orm.log.sql=true